<svg viewBox="0 0 1000 1000" width="1000" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cross-platform Compatible Standard SVG Filter Drop Shadows -->
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="16" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="peach-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="4" dy="16" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="8" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.38" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3D Blue Mascot Sphere Gradient -->
    <radialGradient id="planet-grad" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#60c5fa" />
      <stop offset="25%" stop-color="#30aff5" />
      <stop offset="55%" stop-color="#1496ed" />
      <stop offset="80%" stop-color="#0b7dd4" />
      <stop offset="95%" stop-color="#0861ab" />
      <stop offset="100%" stop-color="#054c87" />
    </radialGradient>

    <!-- Top-Left Gloss Specular -->
    <radialGradient id="planet-highlight" cx="35%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Left Ear Gradient -->
    <radialGradient id="ear-left" cx="42%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#60c5fa" />
      <stop offset="50%" stop-color="#1496ed" />
      <stop offset="100%" stop-color="#0861ab" />
    </radialGradient>

    <!-- Right Ear Gradient -->
    <radialGradient id="ear-right" cx="42%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#60c5fa" />
      <stop offset="50%" stop-color="#1496ed" />
      <stop offset="100%" stop-color="#0861ab" />
    </radialGradient>

    <!-- Peach/Orange Sphere Gradient -->
    <radialGradient id="peach-grad" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="22%" stop-color="#fecba1" />
      <stop offset="52%" stop-color="#fb923c" />
      <stop offset="82%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Peach Highlight -->
    <radialGradient id="peach-highlight" cx="34%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Cyan Ring Tube Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="20%" stop-color="#38bdf8" />
      <stop offset="48%" stop-color="#bae6fd" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Deep Blue Eye Gradient -->
    <linearGradient id="eye-iris" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="40%" stop-color="#075985" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>

  <!-- 1. BACK RING PASS (Arc behind the blue mascot on upper left) -->
  <path
    d="M 235 345 C 130 380 95 460 115 540"
    fill="none"
    stroke="url(#ring-grad)"
    stroke-width="50"
    stroke-linecap="round"
  />

  <!-- 2. MAIN BLUE MASCOT BODY & EARS -->
  <g filter="url(#soft-shadow)">
    <!-- Left Ear nub -->
    <path
      d="M 410 240 C 420 185 460 175 480 215 C 490 235 485 260 470 275 Z"
      fill="url(#ear-left)"
    />
    <!-- Right Ear nub -->
    <path
      d="M 590 245 C 605 190 645 195 660 235 C 670 260 660 280 640 295 Z"
      fill="url(#ear-right)"
    />

    <!-- Spherical Body -->
    <circle cx="500" cy="460" r="295" fill="url(#planet-grad)" />
    <!-- 3D Top-Left Specular Sheen -->
    <circle cx="500" cy="460" r="295" fill="url(#planet-highlight)" />
  </g>

  <!-- 3. FRONT RING PASS (Swooping around bottom and connecting to orange clock) -->
  <g filter="url(#soft-shadow)">
    <path
      d="M 120 540 C 135 620 220 680 340 685 C 460 690 560 655 640 580"
      fill="none"
      stroke="url(#ring-grad)"
      stroke-width="50"
      stroke-linecap="round"
    />
    <!-- Inner specular highlight streak along the ring tube -->
    <path
      d="M 130 535 C 145 605 225 665 340 670 C 450 675 545 645 620 575"
      fill="none"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>

  <!-- 4. FOUR-POINTED STAR FLARE (where ring meets peach sphere) -->
  <path
    d="M 640 575 Q 665 570 685 550 Q 675 575 680 600 Q 655 590 635 595 Q 648 580 640 575 Z"
    fill="#38bdf8"
  />

  <!-- 5. PEACH/ORANGE 3D CLOCK SPHERE -->
  <g filter="url(#peach-shadow)">
    <circle cx="735" cy="625" r="148" fill="url(#peach-grad)" />
    <circle cx="735" cy="625" r="148" fill="url(#peach-highlight)" />

    <!-- Crisp Rounded White Clock Hands (11:00 / 4:30 position matching the authentic logo) -->
    <g transform="translate(735, 625)">
      <!-- Central White Hand Path - clean rounded elbow -->
      <path
        d="M 0 -68 C 10 -68 18 -60 18 -50 L 18 -10 L 46 18 C 54 26 54 38 46 46 C 38 54 26 54 18 46 L -10 18 L -10 -50 C -10 -60 -2 -68 0 -68 Z"
        fill="#ffffff"
      />
    </g>
  </g>

  <!-- 6. BIG CUTE MASCOT EYES (Rendered over the body) -->
  <!-- Left Eye -->
  <g transform="translate(346, 420) rotate(-6)">
    <!-- White outer border/sclera -->
    <ellipse cx="0" cy="0" rx="56" ry="66" fill="#ffffff" />
    <!-- Dark Blue Iris -->
    <ellipse cx="0" cy="0" rx="47" ry="57" fill="url(#eye-iris)" />
    <!-- Big Top-Left Sparkle Highlight -->
    <circle cx="-14" cy="-18" r="18" fill="#ffffff" />
    <!-- Small Bottom-Right Highlight -->
    <circle cx="16" cy="18" r="7.5" fill="#ffffff" />
  </g>

  <!-- Right Eye -->
  <g transform="translate(496, 442) rotate(4)">
    <!-- White outer border/sclera -->
    <ellipse cx="0" cy="0" rx="56" ry="66" fill="#ffffff" />
    <!-- Dark Blue Iris -->
    <ellipse cx="0" cy="0" rx="47" ry="57" fill="url(#eye-iris)" />
    <!-- Big Top-Left Sparkle Highlight -->
    <circle cx="-14" cy="-18" r="18" fill="#ffffff" />
    <!-- Small Bottom-Right Highlight -->
    <circle cx="16" cy="18" r="7.5" fill="#ffffff" />
  </g>

  <!-- 7. "SYNCTIME" CURVED BOLD 3D TYPOGRAPHY (Individual glyphs perfectly aligned along arc) -->
  <g filter="url(#text-shadow)">
    <!-- S -->
    <text x="165" y="700" transform="rotate(38 165 700)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">S</text>
    <!-- Y -->
    <text x="215" y="745" transform="rotate(26 215 745)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">Y</text>
    <!-- N -->
    <text x="275" y="785" transform="rotate(16 275 785)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">N</text>
    <!-- C -->
    <text x="345" y="810" transform="rotate(5 345 810)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">C</text>
    <!-- T -->
    <text x="415" y="820" transform="rotate(-6 415 820)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">T</text>
    <!-- I -->
    <text x="475" y="815" transform="rotate(-15 475 815)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">I</text>
    <!-- M -->
    <text x="515" y="805" transform="rotate(-23 515 805)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">M</text>
    <!-- E -->
    <text x="590" y="770" transform="rotate(-33 590 770)" font-family="Arial Black, Nunito, sans-serif" font-weight="900" font-size="94" fill="#242426">E</text>
  </g>
</svg>